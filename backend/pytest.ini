[pytest]
pythonpath = .
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
addopts = -v --tb=short --strict-markers -p no:warnings
filterwarnings =
    ignore::DeprecationWarning
    ignore::PendingDeprecationWarning
markers =
    slow: marks tests as slow
    integration: marks tests as integration tests
    auth: marks authentication tests
    expenses: marks expense-related tests
    permissions: marks permission tests
    multi_tenant: marks multi-tenancy tests
    critical: Critical priority tests (Phase 1 - 🔴)
    high: High priority tests (Phase 2 - 🟠)
    medium: Medium priority tests (Phase 3 - 🟡)
    security: Security-related tests
    billing: Billing and usage limit tests
    tenant_isolation: Multi-tenancy isolation tests
    approval_flow: Expense approval workflow tests
    sec_iso: SEC-ISO test scenarios (multi-tenant isolation)
    sec_perm: SEC-PERM test scenarios (permission boundaries)
    tier_free: TIER-FREE test scenarios (free tier hard limits)
    role_emp: ROLE-EMP test scenarios (employee role tests)
    role_mgr: ROLE-MGR test scenarios (manager role tests)
    role_acc: ROLE-ACC test scenarios (accountant role tests)
    role_adm: ROLE-ADM test scenarios (admin role tests)
