steps:
  # Build backend image
  - name: 'gcr.io/cloud-builders/docker'
    args:
      - 'build'
      - '-t'
      - 'gcr.io/$PROJECT_ID/ap2-expense-backend:$COMMIT_SHA'
      - '-t'
      - 'gcr.io/$PROJECT_ID/ap2-expense-backend:latest'
      - '-f'
      - 'Dockerfile.backend'
      - '.'

  # Build frontend image
  - name: 'gcr.io/cloud-builders/docker'
    args:
      - 'build'
      - '-t'
      - 'gcr.io/$PROJECT_ID/ap2-expense-frontend:$COMMIT_SHA'
      - '-t'
      - 'gcr.io/$PROJECT_ID/ap2-expense-frontend:latest'
      - '-f'
      - 'Dockerfile.frontend'
      - '.'

  # Push backend image
  - name: 'gcr.io/cloud-builders/docker'
    args: ['push', '--all-tags', 'gcr.io/$PROJECT_ID/ap2-expense-backend']

  # Push frontend image
  - name: 'gcr.io/cloud-builders/docker'
    args: ['push', '--all-tags', 'gcr.io/$PROJECT_ID/ap2-expense-frontend']

  # Deploy backend to Cloud Run
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    entrypoint: gcloud
    args:
      - 'run'
      - 'deploy'
      - 'ap2-expense-backend'
      - '--image'
      - 'gcr.io/$PROJECT_ID/ap2-expense-backend:$COMMIT_SHA'
      - '--region'
      - 'us-central1'
      - '--platform'
      - 'managed'
      - '--allow-unauthenticated'
      - '--min-instances'
      - '1'
      - '--max-instances'
      - '10'
      - '--memory'
      - '2Gi'
      - '--cpu'
      - '2'
      - '--set-env-vars'
      - 'ENVIRONMENT=production'

  # Deploy frontend to Cloud Run
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    entrypoint: gcloud
    args:
      - 'run'
      - 'deploy'
      - 'ap2-expense-frontend'
      - '--image'
      - 'gcr.io/$PROJECT_ID/ap2-expense-frontend:$COMMIT_SHA'
      - '--region'
      - 'us-central1'
      - '--platform'
      - 'managed'
      - '--allow-unauthenticated'
      - '--min-instances'
      - '1'
      - '--max-instances'
      - '5'
      - '--memory'
      - '512Mi'
      - '--cpu'
      - '1'

images:
  - 'gcr.io/$PROJECT_ID/ap2-expense-backend:$COMMIT_SHA'
  - 'gcr.io/$PROJECT_ID/ap2-expense-backend:latest'
  - 'gcr.io/$PROJECT_ID/ap2-expense-frontend:$COMMIT_SHA'
  - 'gcr.io/$PROJECT_ID/ap2-expense-frontend:latest'

timeout: 1800s
