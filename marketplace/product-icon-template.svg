<svg width="512" height="512" viewBox="0 0 512 512" xmlns="http://www.w3.org/2000/svg">
  <!-- Product Icon Template for AP2 Expense Agent -->
  <!-- Edit this file in a vector graphics editor like Inkscape, Figma, or Adobe Illustrator -->

  <!-- Background Circle -->
  <circle cx="256" cy="256" r="240" fill="#4F46E5" stroke="#3730A3" stroke-width="8"/>

  <!-- Receipt Paper -->
  <g id="receipt">
    <!-- Paper background -->
    <rect x="156" y="120" width="200" height="280" rx="8" fill="#FFFFFF" stroke="#E5E7EB" stroke-width="3"/>

    <!-- Receipt serrated top edge -->
    <path d="M 156 120 L 166 125 L 176 120 L 186 125 L 196 120 L 206 125 L 216 120 L 226 125 L 236 120 L 246 125 L 256 120 L 266 125 L 276 120 L 286 125 L 296 120 L 306 125 L 316 120 L 326 125 L 336 120 L 346 125 L 356 120"
          fill="#FFFFFF" stroke="#E5E7EB" stroke-width="2"/>

    <!-- Receipt lines (expense items) -->
    <line x1="176" y1="160" x2="336" y2="160" stroke="#9CA3AF" stroke-width="3" stroke-linecap="round"/>
    <line x1="176" y1="190" x2="306" y2="190" stroke="#9CA3AF" stroke-width="3" stroke-linecap="round"/>
    <line x1="176" y1="220" x2="286" y2="220" stroke="#9CA3AF" stroke-width="3" stroke-linecap="round"/>
    <line x1="176" y1="250" x2="316" y2="250" stroke="#9CA3AF" stroke-width="3" stroke-linecap="round"/>

    <!-- Separator line -->
    <line x1="176" y1="290" x2="336" y2="290" stroke="#D1D5DB" stroke-width="2" stroke-linecap="round"/>

    <!-- Total amount line (bold) -->
    <line x1="176" y1="320" x2="336" y2="320" stroke="#1F2937" stroke-width="5" stroke-linecap="round"/>
  </g>

  <!-- AI Sparkle Icon (top right of receipt) -->
  <g id="ai-indicator" transform="translate(320, 140)">
    <!-- Star/sparkle shape -->
    <path d="M 0,-16 L 4,-4 L 16,0 L 4,4 L 0,16 L -4,4 L -16,0 L -4,-4 Z"
          fill="#FCD34D" stroke="#F59E0B" stroke-width="2"/>
    <path d="M 0,-10 L 2.5,-2.5 L 10,0 L 2.5,2.5 L 0,10 L -2.5,2.5 L -10,0 L -2.5,-2.5 Z"
          fill="#FEF3C7"/>
  </g>

  <!-- Checkmark (approval indicator - bottom right) -->
  <g id="approval-check" transform="translate(340, 360)">
    <circle cx="0" cy="0" r="24" fill="#10B981" stroke="#059669" stroke-width="3"/>
    <path d="M -8,0 L -2,8 L 10,-8" fill="none" stroke="#FFFFFF" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <!-- Currency Symbol ($ icon - left side) -->
  <g id="currency" transform="translate(140, 256)">
    <circle cx="0" cy="0" r="28" fill="#F3F4F6" stroke="#D1D5DB" stroke-width="2"/>
    <text x="0" y="0" font-family="Arial, sans-serif" font-size="36" font-weight="bold"
          fill="#4F46E5" text-anchor="middle" dominant-baseline="central">$</text>
  </g>

  <!-- Optional: Add company name below icon -->
  <!-- Uncomment if you want text in the icon -->
  <!--
  <text x="256" y="470" font-family="Arial, sans-serif" font-size="28" font-weight="bold"
        fill="#FFFFFF" text-anchor="middle">AP2 EXPENSE</text>
  -->
</svg>
