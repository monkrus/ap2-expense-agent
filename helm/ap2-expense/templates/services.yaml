---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "ap2-expense.fullname" . }}-backend
  labels:
    {{- include "ap2-expense.labels" . | nindent 4 }}
    app.kubernetes.io/component: backend
  annotations:
    cloud.google.com/neg: '{"ingress": true}'
spec:
  type: {{ .Values.backend.service.type }}
  ports:
  - port: {{ .Values.backend.service.port }}
    targetPort: http
    protocol: TCP
    name: http
  selector:
    {{- include "ap2-expense.selectorLabels" . | nindent 4 }}
    app.kubernetes.io/component: backend
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "ap2-expense.fullname" . }}-frontend
  labels:
    {{- include "ap2-expense.labels" . | nindent 4 }}
    app.kubernetes.io/component: frontend
  annotations:
    cloud.google.com/neg: '{"ingress": true}'
spec:
  type: {{ .Values.frontend.service.type }}
  ports:
  - port: {{ .Values.frontend.service.port }}
    targetPort: http
    protocol: TCP
    name: http
  selector:
    {{- include "ap2-expense.selectorLabels" . | nindent 4 }}
    app.kubernetes.io/component: frontend
