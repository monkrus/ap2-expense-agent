apiVersion: v1
kind: Secret
metadata:
  name: {{ include "ap2-expense.fullname" . }}-secrets
  labels:
    {{- include "ap2-expense.labels" . | nindent 4 }}
type: Opaque
stringData:
  DATABASE_URL: {{ .Values.secrets.databaseUrl | default "postgresql://user:password@localhost:5432/ap2_expense" | quote }}
  JWT_SECRET_KEY: {{ .Values.secrets.jwtSecretKey | default "REPLACE_WITH_SECURE_RANDOM_STRING" | quote }}
  JWT_REFRESH_SECRET_KEY: {{ .Values.secrets.jwtRefreshSecretKey | default "REPLACE_WITH_SECURE_RANDOM_STRING" | quote }}
  {{- if .Values.secrets.stripeSecretKey }}
  STRIPE_SECRET_KEY: {{ .Values.secrets.stripeSecretKey | quote }}
  {{- end }}
