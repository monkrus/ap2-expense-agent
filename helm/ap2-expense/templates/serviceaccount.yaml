{{- if .Values.serviceAccount.create -}}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "ap2-expense.serviceAccountName" . }}
  labels:
    {{- include "ap2-expense.labels" . | nindent 4 }}
  {{- with .Values.serviceAccount.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
{{- end }}

{{- if .Values.rbac.create -}}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ include "ap2-expense.fullname" . }}
  labels:
    {{- include "ap2-expense.labels" . | nindent 4 }}
rules:
- apiGroups: [""]
  resources: ["configmaps", "secrets"]
  verbs: ["get", "list"]
- apiGroups: [""]
  resources: ["pods"]
  verbs: ["get", "list"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ include "ap2-expense.fullname" . }}
  labels:
    {{- include "ap2-expense.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ include "ap2-expense.fullname" . }}
subjects:
- kind: ServiceAccount
  name: {{ include "ap2-expense.serviceAccountName" . }}
  namespace: {{ .Release.Namespace }}
{{- end }}
