{{- if and .Values.tls.enabled .Values.tls.managedCertificate.enabled }}
apiVersion: networking.gke.io/v1
kind: ManagedCertificate
metadata:
  name: {{ include "ap2-expense.fullname" . }}-managed-cert
  labels:
    {{- include "ap2-expense.labels" . | nindent 4 }}
spec:
  domains:
  {{- range .Values.tls.managedCertificate.domains }}
  - {{ . | quote }}
  {{- end }}
{{- end }}

