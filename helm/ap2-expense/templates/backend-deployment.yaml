apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "ap2-expense.fullname" . }}-backend
  labels:
    {{- include "ap2-expense.labels" . | nindent 4 }}
    app.kubernetes.io/component: backend
spec:
  {{- if not .Values.backend.autoscaling.enabled }}
  replicas: {{ .Values.backend.replicaCount }}
  {{- end }}
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      {{- include "ap2-expense.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: backend
  template:
    metadata:
      labels:
        {{- include "ap2-expense.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: backend
      annotations:
        prometheus.io/scrape: "{{ .Values.monitoring.enabled }}"
        prometheus.io/port: "{{ .Values.backend.service.targetPort }}"
        prometheus.io/path: "/metrics"
    spec:
      serviceAccountName: {{ include "ap2-expense.serviceAccountName" . }}
      securityContext:
        {{- toYaml .Values.securityContext | nindent 8 }}
      containers:
      - name: backend
        image: {{ include "ap2-expense.backend.image" . }}
        imagePullPolicy: {{ .Values.images.backend.pullPolicy }}
        ports:
        - name: http
          containerPort: {{ .Values.backend.service.targetPort }}
          protocol: TCP
        env:
        - name: PORT
          value: "{{ .Values.backend.service.targetPort }}"
        - name: ENVIRONMENT
          value: "{{ .Values.backend.env.ENVIRONMENT }}"
        - name: LOG_LEVEL
          value: "{{ .Values.backend.env.LOG_LEVEL }}"
        {{- if .Values.backend.env.GCP_WEBHOOK_AUDIENCE }}
        - name: GCP_WEBHOOK_AUDIENCE
          value: "{{ .Values.backend.env.GCP_WEBHOOK_AUDIENCE }}"
        {{- end }}
        - name: DATABASE_URL
          valueFrom:
            secretKeyRef:
              name: {{ include "ap2-expense.fullname" . }}-secrets
              key: DATABASE_URL
        - name: JWT_SECRET_KEY
          valueFrom:
            secretKeyRef:
              name: {{ include "ap2-expense.fullname" . }}-secrets
              key: JWT_SECRET_KEY
        - name: JWT_REFRESH_SECRET_KEY
          valueFrom:
            secretKeyRef:
              name: {{ include "ap2-expense.fullname" . }}-secrets
              key: JWT_REFRESH_SECRET_KEY
        {{- if .Values.redis.enabled }}
        - name: REDIS_URL
          value: "redis://{{ .Values.redis.host }}:{{ .Values.redis.port }}/{{ .Values.redis.database }}"
        {{- end }}
        resources:
          {{- toYaml .Values.backend.resources | nindent 10 }}
        livenessProbe:
          httpGet:
            path: /health
            port: http
          initialDelaySeconds: 60
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 3
        readinessProbe:
          httpGet:
            path: /health
            port: http
          initialDelaySeconds: 30
          periodSeconds: 5
          timeoutSeconds: 3
          failureThreshold: 3
        securityContext:
          {{- toYaml .Values.podSecurityContext | nindent 10 }}
