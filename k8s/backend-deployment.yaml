apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend
  namespace: ap2-expense
  labels:
    app.kubernetes.io/name: ap2-expense-agent
    app.kubernetes.io/component: backend
    app.kubernetes.io/version: "1.0.0"
spec:
  replicas: 3
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app.kubernetes.io/name: ap2-expense-agent
      app.kubernetes.io/component: backend
  template:
    metadata:
      labels:
        app.kubernetes.io/name: ap2-expense-agent
        app.kubernetes.io/component: backend
        app.kubernetes.io/version: "1.0.0"
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8080"
        prometheus.io/path: "/metrics"
    spec:
      serviceAccountName: ap2-expense-sa
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        fsGroup: 1000

      containers:
      # Cloud SQL Proxy sidecar for secure database connections
      - name: cloudsql-proxy
        image: gcr.io/cloud-sql-connectors/cloud-sql-proxy:2.8.0
        args:
          - "--structured-logs"
          - "--port=5432"
          - "--address=0.0.0.0"
          - "YOUR_PROJECT_ID:us-central1:ap2-expense-db"
        # If using a service account key file (otherwise prefer Workload Identity)
        # volumeMounts:
        # - name: gcp-sa
        #   mountPath: /secrets
        #   readOnly: true

        securityContext:
          runAsNonRoot: true
          allowPrivilegeEscalation: false
          capabilities:
            drop:
            - ALL

        resources:
          requests:
            cpu: 100m
            memory: 128Mi
          limits:
            cpu: 200m
            memory: 256Mi

      - name: backend
        image: gcr.io/YOUR_PROJECT_ID/ap2-expense-backend:1.0.0
        imagePullPolicy: Always

        ports:
        - name: http
          containerPort: 8080
          protocol: TCP

        env:
        - name: PORT
          value: "8080"
        # Prefer Secret Manager CSI synced secrets if available
        - name: DATABASE_URL
          valueFrom:
            secretKeyRef:
              name: ap2-expense-secrets-gsm
              key: DATABASE_URL
              optional: true
        - name: JWT_SECRET_KEY
          valueFrom:
            secretKeyRef:
              name: ap2-expense-secrets-gsm
              key: JWT_SECRET_KEY
              optional: true
        - name: STRIPE_SECRET_KEY
          valueFrom:
            secretKeyRef:
              name: ap2-expense-secrets-gsm
              key: STRIPE_SECRET_KEY
              optional: true
        - name: GCP_WEBHOOK_SECRET
          valueFrom:
            secretKeyRef:
              name: ap2-expense-secrets-gsm
              key: GCP_WEBHOOK_SECRET
              optional: true
        - name: ENVIRONMENT
          valueFrom:
            configMapKeyRef:
              name: ap2-expense-config
              key: ENVIRONMENT
        - name: LOG_LEVEL
          valueFrom:
            configMapKeyRef:
              name: ap2-expense-config
              key: LOG_LEVEL
        # Database connection via Cloud SQL Proxy on localhost:5432
        - name: DATABASE_URL
          value: "postgresql://$(DB_USER):$(DB_PASSWORD)@127.0.0.1:5432/ap2_expense?sslmode=disable"
        - name: DB_USER
          valueFrom:
            secretKeyRef:
              name: ap2-expense-secrets
              key: DB_USER
        - name: DB_PASSWORD
          valueFrom:
            secretKeyRef:
              name: ap2-expense-secrets
              key: DB_PASSWORD
        - name: JWT_SECRET_KEY
          valueFrom:
            secretKeyRef:
              name: ap2-expense-secrets
              key: JWT_SECRET_KEY
        - name: JWT_REFRESH_SECRET_KEY
          valueFrom:
            secretKeyRef:
              name: ap2-expense-secrets
              key: JWT_REFRESH_SECRET_KEY
        - name: REDIS_URL
          valueFrom:
            configMapKeyRef:
              name: ap2-expense-config
              key: REDIS_URL
              optional: true
        - name: STRIPE_SECRET_KEY
          valueFrom:
            secretKeyRef:
              name: ap2-expense-secrets
              key: STRIPE_SECRET_KEY
              optional: true
        # GCP Configuration for KMS, Secret Manager, etc.
        - name: GCP_PROJECT_ID
          value: "YOUR_PROJECT_ID"
        - name: GCP_KMS_LOCATION
          value: "us-central1"
        - name: GCP_KMS_KEYRING
          value: "ap2-expense-keyring"
        - name: GCP_KMS_SIGNING_KEY
          value: "ap2-mandate-signing-key"
        - name: GOOGLE_CLOUD_PROJECT
          value: "YOUR_PROJECT_ID"

        resources:
          requests:
            cpu: 250m
            memory: 512Mi
          limits:
            cpu: 1000m
            memory: 1Gi

        livenessProbe:
          httpGet:
            path: /health
            port: http
          initialDelaySeconds: 60
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 3

        readinessProbe:
          httpGet:
            path: /health
            port: http
          initialDelaySeconds: 30
          periodSeconds: 5
          timeoutSeconds: 3
          failureThreshold: 3

        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: false
          capabilities:
            drop:
            - ALL

        volumeMounts:
        - name: tmp
          mountPath: /tmp

      volumes:
      - name: tmp
        emptyDir: {}
      # - name: gcp-sa
      #   secret:
      #     secretName: ap2-expense-gcp-sa

      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
          - weight: 100
            podAffinityTerm:
              labelSelector:
                matchExpressions:
                - key: app.kubernetes.io/component
                  operator: In
                  values:
                  - backend
              topologyKey: kubernetes.io/hostname
