apiVersion: batch/v1
kind: CronJob
metadata:
  name: billing-usage-reporter
  namespace: ap2-expense
  labels:
    app.kubernetes.io/name: ap2-expense-agent
    app.kubernetes.io/component: billing
spec:
  # Run every hour (Google Cloud Marketplace requires hourly reporting)
  schedule: "0 * * * *"

  # Keep last 3 successful and 1 failed job
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 1

  # Job template
  jobTemplate:
    metadata:
      labels:
        app.kubernetes.io/name: ap2-expense-agent
        app.kubernetes.io/component: billing
    spec:
      # Don't run concurrently
      concurrencyPolicy: Forbid

      # Clean up completed jobs after 1 hour
      ttlSecondsAfterFinished: 3600

      template:
        metadata:
          labels:
            app.kubernetes.io/name: ap2-expense-agent
            app.kubernetes.io/component: billing
        spec:
          serviceAccountName: ap2-expense-sa
          restartPolicy: OnFailure

          containers:
          - name: usage-reporter
            image: gcr.io/YOUR_PROJECT_ID/ap2-expense-backend:latest
            imagePullPolicy: Always

            command:
            - python
            - -m
            - scripts.report_usage

            env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: ap2-expense-secrets
                  key: DATABASE_URL
            - name: ENVIRONMENT
              value: "production"
            - name: LOG_LEVEL
              value: "info"

            resources:
              requests:
                cpu: 100m
                memory: 256Mi
              limits:
                cpu: 500m
                memory: 512Mi

            securityContext:
              runAsNonRoot: true
              runAsUser: 1000
              allowPrivilegeEscalation: false
              capabilities:
                drop:
                - ALL
