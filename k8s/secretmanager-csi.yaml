# Example: Secret Manager CSI driver integration (GKE)
# Requires GKE Secret Manager CSI driver add-on and appropriate IAM bindings.

apiVersion: secrets-store.csi.x-k8s.io/v1
kind: SecretProviderClass
metadata:
  name: ap2-expense-gsm
  namespace: ap2-expense
spec:
  provider: gcp
  parameters:
    secrets: |
      - resourceName: "projects/YOUR_PROJECT_ID/secrets/jwt-secret-key/versions/latest"
        fileName: "JWT_SECRET_KEY"
      - resourceName: "projects/YOUR_PROJECT_ID/secrets/database-connection-string/versions/latest"
        fileName: "DATABASE_URL"
      - resourceName: "projects/YOUR_PROJECT_ID/secrets/stripe-secret-key/versions/latest"
        fileName: "STRIPE_SECRET_KEY"
      - resourceName: "projects/YOUR_PROJECT_ID/secrets/gcp-webhook-secret/versions/latest"
        fileName: "GCP_WEBHOOK_SECRET"
  secretObjects:
    - secretName: ap2-expense-secrets-gsm
      type: Opaque
      data:
        - objectName: JWT_SECRET_KEY
          key: JWT_SECRET_KEY
        - objectName: DATABASE_URL
          key: DATABASE_URL
        - objectName: STRIPE_SECRET_KEY
          key: STRIPE_SECRET_KEY
        - objectName: GCP_WEBHOOK_SECRET
          key: GCP_WEBHOOK_SECRET

---
