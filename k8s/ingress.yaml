apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: ap2-expense-ingress
  namespace: ap2-expense
  labels:
    app.kubernetes.io/name: ap2-expense-agent
    app.kubernetes.io/component: ingress
  annotations:
    # Google Cloud Load Balancer
    kubernetes.io/ingress.class: "gce"
    kubernetes.io/ingress.global-static-ip-name: "ap2-expense-ip"
    networking.gke.io/managed-certificates: "ap2-expense-cert"

    # Cloud CDN
    cloud.google.com/cdn-enabled: "true"
    cloud.google.com/neg: '{"ingress": true}'

    # Cloud Armor (DDoS protection)
    cloud.google.com/armor-config: '{"ap2-expense-security-policy": "ap2-expense-policy"}'

    # Timeouts
    cloud.google.com/timeout: "60s"
spec:
  rules:
  - host: your-domain.com
    http:
      paths:
      - path: /api/*
        pathType: ImplementationSpecific
        backend:
          service:
            name: backend-service
            port:
              number: 8000
      - path: /*
        pathType: ImplementationSpecific
        backend:
          service:
            name: frontend-service
            port:
              number: 80
