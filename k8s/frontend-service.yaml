apiVersion: v1
kind: Service
metadata:
  name: frontend-service
  namespace: ap2-expense
  labels:
    app.kubernetes.io/name: ap2-expense-agent
    app.kubernetes.io/component: frontend
  annotations:
    cloud.google.com/neg: '{"ingress": true}'
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: ap2-expense-agent
    app.kubernetes.io/component: frontend
  ports:
  - name: http
    port: 80
    targetPort: http
    protocol: TCP
  sessionAffinity: None
