apiVersion: v1
kind: ServiceAccount
metadata:
  name: ap2-expense-sa
  namespace: ap2-expense
  labels:
    app.kubernetes.io/name: ap2-expense-agent
    app.kubernetes.io/component: serviceaccount
  annotations:
    # Google Cloud IAM binding
    iam.gke.io/gcp-service-account: ap2-expense@YOUR_PROJECT_ID.iam.gserviceaccount.com

---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: ap2-expense-role
  namespace: ap2-expense
  labels:
    app.kubernetes.io/name: ap2-expense-agent
rules:
- apiGroups: [""]
  resources: ["configmaps", "secrets"]
  verbs: ["get", "list"]
- apiGroups: [""]
  resources: ["pods"]
  verbs: ["get", "list"]

---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: ap2-expense-rolebinding
  namespace: ap2-expense
  labels:
    app.kubernetes.io/name: ap2-expense-agent
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: ap2-expense-role
subjects:
- kind: ServiceAccount
  name: ap2-expense-sa
  namespace: ap2-expense
