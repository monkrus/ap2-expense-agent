# IMPORTANT: This is a template. DO NOT commit actual secrets to git.
# Create secrets using kubectl or Google Secret Manager:
#
# kubectl create secret generic ap2-expense-secrets \
#   --from-literal=database-url='postgresql://...' \
#   --from-literal=jwt-secret='...' \
#   --from-literal=stripe-secret-key='...' \
#   --namespace=ap2-expense

apiVersion: v1
kind: Secret
metadata:
  name: ap2-expense-secrets
  namespace: ap2-expense
  labels:
    app.kubernetes.io/name: ap2-expense-agent
    app.kubernetes.io/component: secrets
type: Opaque
stringData:
  # Database connection string (for Cloud Run / direct connections)
  DATABASE_URL: "REPLACE_WITH_CONNECTION_STRING"

  # Database credentials (for Cloud SQL Proxy)
  DB_USER: "ap2user"
  DB_PASSWORD: "REPLACE_WITH_SECURE_RANDOM_STRING"

  # JWT secret key (generate with: openssl rand -hex 32)
  JWT_SECRET_KEY: "REPLACE_WITH_SECURE_RANDOM_STRING"
  JWT_REFRESH_SECRET_KEY: "REPLACE_WITH_SECURE_RANDOM_STRING"

  # Stripe payment processor (AP2 optional)
  STRIPE_SECRET_KEY: "REPLACE_WITH_STRIPE_KEY"

  # OAuth secrets (optional)
  GOOGLE_CLIENT_ID: ""
  GOOGLE_CLIENT_SECRET: ""

  # Email service (optional)
  SENDGRID_API_KEY: ""
  SMTP_PASSWORD: ""
