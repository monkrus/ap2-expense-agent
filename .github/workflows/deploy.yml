name: Deploy to Google Cloud

on:
  push:
    branches: [ main ]
  workflow_dispatch:
    inputs:
      environment:
        description: 'Deployment environment'
        required: true
        default: 'staging'
        type: choice
        options:
          - staging
          - production

env:
  PROJECT_ID: ${{ secrets.GCP_PROJECT_ID }}
  GCP_REGION: us-central1
  BACKEND_IMAGE: gcr.io/${{ secrets.GCP_PROJECT_ID }}/ap2-expense-backend
  FRONTEND_IMAGE: gcr.io/${{ secrets.GCP_PROJECT_ID }}/ap2-expense-frontend

jobs:
  deploy:
    name: Deploy Application
    runs-on: ubuntu-latest
    environment: ${{ github.event.inputs.environment || 'staging' }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v1
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v1

      - name: Configure Docker for GCR
        run: gcloud auth configure-docker

      - name: Build and push backend image
        run: |
          docker build -t $BACKEND_IMAGE:${{ github.sha }} ./backend
          docker push $BACKEND_IMAGE:${{ github.sha }}

      - name: Build and push frontend image
        run: |
          docker build -t $FRONTEND_IMAGE:${{ github.sha }} ./frontend
          docker push $FRONTEND_IMAGE:${{ github.sha }}

      - name: Deploy to Cloud Run - Backend
        run: |
          gcloud run deploy ap2-expense-backend \
            --image $BACKEND_IMAGE:${{ github.sha }} \
            --platform managed \
            --region $GCP_REGION \
            --allow-unauthenticated \
            --set-env-vars "DATABASE_URL=${{ secrets.DATABASE_URL }}" \
            --set-env-vars "REDIS_URL=${{ secrets.REDIS_URL }}" \
            --set-env-vars "JWT_SECRET_KEY=${{ secrets.JWT_SECRET_KEY }}" \
            --set-env-vars "ENVIRONMENT=${{ github.event.inputs.environment || 'staging' }}" \
            --set-env-vars "SENTRY_DSN=${{ secrets.SENTRY_DSN }}" \
            --set-secrets="GOOGLE_CLIENT_ID=google-oauth-client-id:latest" \
            --set-secrets="GOOGLE_CLIENT_SECRET=google-oauth-client-secret:latest" \
            --cpu 2 \
            --memory 2Gi \
            --min-instances 1 \
            --max-instances 10 \
            --timeout 300

      - name: Deploy to Cloud Run - Frontend
        run: |
          gcloud run deploy ap2-expense-frontend \
            --image $FRONTEND_IMAGE:${{ github.sha }} \
            --platform managed \
            --region $GCP_REGION \
            --allow-unauthenticated \
            --set-env-vars "VITE_API_URL=${{ secrets.BACKEND_URL }}" \
            --set-env-vars "VITE_ENVIRONMENT=${{ github.event.inputs.environment || 'staging' }}" \
            --cpu 1 \
            --memory 512Mi \
            --min-instances 1 \
            --max-instances 5 \
            --timeout 60

      - name: Run database migrations
        run: |
          gcloud run jobs create db-migration \
            --image $BACKEND_IMAGE:${{ github.sha }} \
            --region $GCP_REGION \
            --set-env-vars "DATABASE_URL=${{ secrets.DATABASE_URL }}" \
            --command "alembic" \
            --args "upgrade,head" \
            --execute-now \
            --wait

      - name: Health check
        run: |
          BACKEND_URL=$(gcloud run services describe ap2-expense-backend \
            --region $GCP_REGION \
            --format 'value(status.url)')

          echo "Checking backend health at $BACKEND_URL/health"

          for i in {1..10}; do
            if curl -f "$BACKEND_URL/health"; then
              echo "Health check passed"
              exit 0
            fi
            echo "Health check attempt $i failed, retrying..."
            sleep 10
          done

          echo "Health check failed after 10 attempts"
          exit 1

      - name: Notify deployment success
        if: success()
        uses: slackapi/slack-github-action@v1
        with:
          webhook-url: ${{ secrets.SLACK_WEBHOOK_URL }}
          payload: |
            {
              "text": "✅ Deployment to ${{ github.event.inputs.environment || 'staging' }} successful",
              "blocks": [
                {
                  "type": "section",
                  "text": {
                    "type": "mrkdwn",
                    "text": "*Deployment Successful*\n*Environment:* ${{ github.event.inputs.environment || 'staging' }}\n*Commit:* ${{ github.sha }}\n*Author:* ${{ github.actor }}"
                  }
                }
              ]
            }

      - name: Notify deployment failure
        if: failure()
        uses: slackapi/slack-github-action@v1
        with:
          webhook-url: ${{ secrets.SLACK_WEBHOOK_URL }}
          payload: |
            {
              "text": "❌ Deployment to ${{ github.event.inputs.environment || 'staging' }} failed",
              "blocks": [
                {
                  "type": "section",
                  "text": {
                    "type": "mrkdwn",
                    "text": "*Deployment Failed*\n*Environment:* ${{ github.event.inputs.environment || 'staging' }}\n*Commit:* ${{ github.sha }}\n*Author:* ${{ github.actor }}"
                  }
                }
              ]
            }

  rollback:
    name: Rollback on Failure
    runs-on: ubuntu-latest
    needs: deploy
    if: failure()
    environment: ${{ github.event.inputs.environment || 'staging' }}

    steps:
      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v1
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v1

      - name: Rollback backend to previous version
        run: |
          PREVIOUS_REVISION=$(gcloud run revisions list \
            --service ap2-expense-agent-backend \
            --region $GCP_REGION \
            --format 'value(name)' \
            --limit 2 | tail -n 1)

          gcloud run services update-traffic ap2-expense-agent-backend \
            --region $GCP_REGION \
            --to-revisions $PREVIOUS_REVISION=100

      - name: Rollback frontend to previous version
        run: |
          PREVIOUS_REVISION=$(gcloud run revisions list \
            --service ap2-expense-agent-frontend \
            --region $GCP_REGION \
            --format 'value(name)' \
            --limit 2 | tail -n 1)

          gcloud run services update-traffic ap2-expense-agent-frontend \
            --region $GCP_REGION \
            --to-revisions $PREVIOUS_REVISION=100
