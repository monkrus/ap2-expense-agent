name: Deploy to Cloud Run

on:
  workflow_dispatch:
    inputs:
      project_id:
        description: 'GCP Project ID'
        required: true
      region:
        description: 'GCP Region'
        default: 'us-central1'
        required: true
  push:
    tags:
      - 'v*'
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest
    if: ${{ (secrets.GCP_WORKLOAD_IDENTITY_PROVIDER != '' && secrets.GCP_SERVICE_ACCOUNT != '') || secrets.GCP_SERVICE_ACCOUNT_KEY != '' }}
    permissions:
      contents: 'read'
      id-token: 'write'
    steps:
      - uses: actions/checkout@v4

      - name: Validate auth inputs
        run: |
          if [ -n "${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}" ] && [ -n "${{ secrets.GCP_SERVICE_ACCOUNT_KEY }}" ]; then
            echo "::error::Provide only one of GCP_WORKLOAD_IDENTITY_PROVIDER or GCP_SERVICE_ACCOUNT_KEY"
            exit 1
          fi
          if [ -z "${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}" ] && [ -z "${{ secrets.GCP_SERVICE_ACCOUNT_KEY }}" ]; then
            echo "::error::No GCP credentials provided; skipping deploy."
            exit 1
          fi
          if [ -z "${{ secrets.CORS_ORIGINS }}" ]; then
            echo "::error::CORS_ORIGINS secret is required for production/staging deploys."
            exit 1
          fi

      - name: Set up Google Cloud SDK
        uses: google-github-actions/setup-gcloud@v2
        with:
          project_id: ${{ github.event.inputs.project_id || secrets.GCP_PROJECT_ID }}
          install_components: 'beta'

      - name: Auth with Workload Identity Federation
        if: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER != '' && secrets.GCP_SERVICE_ACCOUNT != '' && secrets.GCP_SERVICE_ACCOUNT_KEY == '' }}
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_SERVICE_ACCOUNT }}

      - name: Auth with Service Account Key
        if: ${{ secrets.GCP_SERVICE_ACCOUNT_KEY != '' && (secrets.GCP_WORKLOAD_IDENTITY_PROVIDER == '' || secrets.GCP_SERVICE_ACCOUNT == '') }}
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SERVICE_ACCOUNT_KEY }}

      - name: Configure gcloud project/region
        run: |
          gcloud config set project "${{ github.event.inputs.project_id || secrets.GCP_PROJECT_ID }}"
          echo "REGION=${{ github.event.inputs.region || secrets.GCP_REGION || 'us-central1' }}" >> $GITHUB_ENV

      - name: Build and push Backend image
        run: |
          COMMIT_SHA=${GITHUB_SHA::12}
          gcloud builds submit --tag gcr.io/${{ github.event.inputs.project_id || secrets.GCP_PROJECT_ID }}/ap2-expense-backend:${COMMIT_SHA} --config cloudbuild.yaml

      - name: Build and push Frontend image
        run: |
          COMMIT_SHA=${GITHUB_SHA::12}
          gcloud builds submit --tag gcr.io/${{ github.event.inputs.project_id || secrets.GCP_PROJECT_ID }}/ap2-expense-frontend:${COMMIT_SHA} --config cloudbuild.yaml

      - name: Deploy Backend to Cloud Run
        env:
          JWT_SECRET: ${{ secrets.JWT_SECRET }}
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          REDIS_URL: ${{ secrets.REDIS_URL }}
          FRONTEND_URL: ${{ secrets.FRONTEND_URL }}
          CORS_ORIGINS: ${{ secrets.CORS_ORIGINS }}
          ALLOW_UNAUTHENTICATED: ${{ secrets.ALLOW_UNAUTHENTICATED }}
          MAX_INSTANCES_BACKEND: ${{ secrets.MAX_INSTANCES_BACKEND }}
          MAX_INSTANCES_FRONTEND: ${{ secrets.MAX_INSTANCES_FRONTEND }}
          MIN_INSTANCES_BACKEND: ${{ secrets.MIN_INSTANCES_BACKEND }}
          MIN_INSTANCES_FRONTEND: ${{ secrets.MIN_INSTANCES_FRONTEND }}
          CPU_BACKEND: ${{ secrets.CPU_BACKEND }}
          MEMORY_BACKEND: ${{ secrets.MEMORY_BACKEND }}
          CPU_FRONTEND: ${{ secrets.CPU_FRONTEND }}
          MEMORY_FRONTEND: ${{ secrets.MEMORY_FRONTEND }}
        run: |
          if [ -z "$JWT_SECRET" ] || [ -z "$DATABASE_URL" ]; then
            echo "::error::Missing JWT_SECRET or DATABASE_URL secrets; refusing to deploy insecure defaults."
            exit 1
          fi
          if [ -z "$CORS_ORIGINS" ]; then
            echo "::error::Missing CORS_ORIGINS secret; refusing to deploy with insecure CORS defaults."
            exit 1
          fi
          COMMIT_SHA=${GITHUB_SHA::12}
          AUTH_FLAG="--no-allow-unauthenticated"
          INGRESS_FLAG="--ingress internal-and-cloud-load-balancing"
          if [ "${ALLOW_UNAUTHENTICATED:-false}" = "true" ]; then
            AUTH_FLAG="--allow-unauthenticated"
            INGRESS_FLAG="--ingress all"
          fi
          MAX_BACKEND=${MAX_INSTANCES_BACKEND:-10}
          MIN_BACKEND=${MIN_INSTANCES_BACKEND:-1}
          CPU_BACK=${CPU_BACKEND:-2}
          MEM_BACK=${MEMORY_BACKEND:-2Gi}
          gcloud run deploy ap2-expense-backend \
            --image gcr.io/${{ github.event.inputs.project_id || secrets.GCP_PROJECT_ID }}/ap2-expense-backend:${COMMIT_SHA} \
            --region $REGION --platform managed \
            --min-instances $MIN_BACKEND --max-instances $MAX_BACKEND --memory $MEM_BACK --cpu $CPU_BACK --port 8080 --concurrency 80 --execution-environment gen2 --cpu-boost \
            --set-env-vars ENVIRONMENT=production,DEBUG=false,ALLOW_DEV_KMS_FALLBACK=false,RATE_LIMIT_ENABLED=true,JWT_SECRET=$JWT_SECRET,DATABASE_URL=$DATABASE_URL,GCP_PROJECT_ID=${{ github.event.inputs.project_id || secrets.GCP_PROJECT_ID }},REDIS_URL=${REDIS_URL:-redis://localhost:6379/0},FRONTEND_URL=${FRONTEND_URL:-},CORS_ORIGINS="$CORS_ORIGINS" \
            $AUTH_FLAG $INGRESS_FLAG

      - name: Smoke test backend
        run: |
          URL=$(gcloud run services describe ap2-expense-backend --region $REGION --format="value(status.url)")
          if [ -z "$URL" ]; then
            echo "::error::Could not resolve backend URL"
            exit 1
          fi
          curl -f "$URL/health" || exit 1
          curl -f "$URL/api/webhooks/gcp/health" || exit 1

      - name: Deploy Frontend to Cloud Run
        run: |
          COMMIT_SHA=${GITHUB_SHA::12}
          AUTH_FLAG="--allow-unauthenticated"
          INGRESS_FLAG="--ingress all"
          if [ "${ALLOW_UNAUTHENTICATED:-false}" = "false" ]; then
            AUTH_FLAG="--no-allow-unauthenticated"
            INGRESS_FLAG="--ingress internal-and-cloud-load-balancing"
          fi
          MAX_FRONT=${MAX_INSTANCES_FRONTEND:-5}
          MIN_FRONT=${MIN_INSTANCES_FRONTEND:-1}
          CPU_FRONT=${CPU_FRONTEND:-1}
          MEM_FRONT=${MEMORY_FRONTEND:-512Mi}
          gcloud run deploy ap2-expense-frontend \
            --image gcr.io/${{ github.event.inputs.project_id || secrets.GCP_PROJECT_ID }}/ap2-expense-frontend:${COMMIT_SHA} \
            --region $REGION --platform managed \
            --min-instances $MIN_FRONT --max-instances $MAX_FRONT --memory $MEM_FRONT --cpu $CPU_FRONT --port 8080 --concurrency 50 --execution-environment gen2 --cpu-boost \
            $AUTH_FLAG $INGRESS_FLAG

      - name: Smoke test frontend
        run: |
          URL=$(gcloud run services describe ap2-expense-frontend --region $REGION --format="value(status.url)")
          if [ -z "$URL" ]; then
            echo "::error::Could not resolve frontend URL"
            exit 1
          fi
          curl -f "$URL" || exit 1
