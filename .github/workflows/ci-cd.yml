name: CI/CD Pipeline

on:
  pull_request:
    branches: [main, develop]
  push:
    branches: [main, develop]
  workflow_dispatch:

env:
  PYTHON_VERSION: '3.11'
  NODE_VERSION: '22.x'
  COVERAGE_THRESHOLD: 75

jobs:
  # ============================================================================
  # PRE-MERGE CHECKS (Pull Request Gates)
  # ============================================================================

  lint-backend:
    name: Lint Backend (Python)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Cache pip dependencies
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('backend/requirements.txt') }}

      - name: Install dependencies
        working-directory: backend
        run: |
          python -m pip install --upgrade pip
          pip install flake8 black isort pylint

      - name: Run Black (code formatting)
        working-directory: backend
        run: black --check src/ tests/

      - name: Run isort (import sorting)
        working-directory: backend
        run: isort --check-only src/ tests/

      - name: Run Flake8 (linting)
        working-directory: backend
        run: flake8 src/ tests/ --max-line-length=120 --extend-ignore=E203,W503,F401,F841,E712,E722,F541,W293,E402,E231,F811,E501,E711
        continue-on-error: true

  lint-frontend:
    name: Lint Frontend (TypeScript/JavaScript)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      - name: Run ESLint
        working-directory: frontend
        run: npm run lint

      - name: Run Prettier check
        working-directory: frontend
        run: npx prettier --check "src/**/*.{js,jsx,ts,tsx,json,css,md}"

  # ============================================================================
  # SECURITY - SAST (Static Application Security Testing)
  # ============================================================================

  security-sast-python:
    name: Security - SAST (Python)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install Bandit
        run: pip install bandit[toml]

      - name: Run Bandit security scan
        working-directory: backend
        run: |
          bandit -r src/ -f json -o bandit-report.json || true
          bandit -r src/ -ll

      - name: Upload Bandit report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: bandit-report
          path: backend/bandit-report.json

  security-sast-javascript:
    name: Security - SAST (JavaScript)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      - name: Run ESLint security plugin
        working-directory: frontend
        run: |
          npm install --save-dev eslint-plugin-security
          npx eslint --plugin security --rule "security/detect-object-injection: error" src/

  # ============================================================================
  # SECURITY - Dependency Scanning
  # ============================================================================

  security-dependencies-python:
    name: Security - Python Dependencies
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install pip-audit
        run: pip install pip-audit

      - name: Run pip-audit
        working-directory: backend
        run: |
          pip-audit --requirement requirements.txt --format json --output pip-audit-report.json || true
          pip-audit --requirement requirements.txt
        continue-on-error: true

      - name: Upload pip-audit report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pip-audit-report
          path: backend/pip-audit-report.json

  security-dependencies-npm:
    name: Security - npm Dependencies
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Run npm audit
        working-directory: frontend
        run: |
          npm audit --json > npm-audit-report.json || true
          npm audit
        continue-on-error: true

      - name: Upload npm audit report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: npm-audit-report
          path: frontend/npm-audit-report.json

  # ============================================================================
  # SECRET DETECTION
  # ============================================================================

  security-secrets:
    name: Security - Secret Detection
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run Gitleaks
        uses: gitleaks/gitleaks-action@v2
        with:
          config-path: .gitleaks.toml
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # ============================================================================
  # UNIT TESTS - Backend
  # ============================================================================

  test-backend:
    name: Test Backend (Unit + Integration)
    runs-on: ubuntu-latest
    env:
      PIP_CONSTRAINT: ""
      REDIS_URL: redis://localhost:6379/0
    services:
      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Clear pip constraint (Dependabot safety)
        run: echo "PIP_CONSTRAINT=" >> $GITHUB_ENV

      - name: Cache pip dependencies
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('backend/requirements.txt') }}

      - name: Install dependencies
        working-directory: backend
        run: |
          unset PIP_CONSTRAINT || true
          python -m pip install --upgrade pip
          pip install -r requirements.txt
        env:
          PIP_CONSTRAINT: ""

      - name: Run tests with coverage
        working-directory: backend
        run: |
          pytest tests/ -v --cov=src --cov-report=xml --cov-report=html --cov-report=term-missing --junitxml=pytest-report.xml

      - name: Check coverage threshold
        working-directory: backend
        run: |
          coverage report --fail-under=${{ env.COVERAGE_THRESHOLD }} || echo "Coverage below threshold"
        continue-on-error: true

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v4
        with:
          files: backend/coverage.xml
          flags: backend
          name: backend-coverage

      - name: Upload test results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: backend-test-results
          path: |
            backend/pytest-report.xml
            backend/htmlcov/

  # ============================================================================
  # UNIT TESTS - Frontend
  # ============================================================================

  test-frontend:
    name: Test Frontend (Unit)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      - name: Run tests (when implemented)
        working-directory: frontend
        run: |
          # npm test -- --coverage --watchAll=false || echo "Frontend tests not yet implemented"
          echo "Frontend unit tests to be implemented"
        continue-on-error: true

      - name: Build frontend
        working-directory: frontend
        run: npm run build

  # ============================================================================
  # E2E TESTS - Playwright
  # ============================================================================

  test-e2e:
    name: E2E Tests (Playwright)
    runs-on: ubuntu-latest
    needs: [test-backend, test-frontend]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Install backend dependencies
        working-directory: backend
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Install Playwright
        working-directory: frontend
        run: npx playwright install --with-deps

      - name: Start backend server
        working-directory: backend
        run: |
          uvicorn src.api:app --host 0.0.0.0 --port 8000 &
          sleep 10
        env:
          DATABASE_URL: sqlite:///./test.db
          TESTING: "true"

      - name: Start frontend server
        working-directory: frontend
        run: |
          npm run dev &
          sleep 10

      - name: Run Playwright E2E tests
        working-directory: frontend
        run: npx playwright test

      - name: Upload Playwright report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-report
          path: frontend/playwright-report/

  # ============================================================================
  # PERFORMANCE TESTS - k6
  # ============================================================================

  test-performance:
    name: Performance Tests (k6)
    runs-on: ubuntu-latest
    needs: [test-backend]
    steps:
      - uses: actions/checkout@v4

      - name: Set up k6
        run: |
          sudo gpg -k
          sudo gpg --no-default-keyring --keyring /usr/share/keyrings/k6-archive-keyring.gpg --keyserver hkp://keyserver.ubuntu.com:80 --recv-keys C5AD17C747E3415A3642D57D77C6C491D6AC1D69
          echo "deb [signed-by=/usr/share/keyrings/k6-archive-keyring.gpg] https://dl.k6.io/deb stable main" | sudo tee /etc/apt/sources.list.d/k6.list
          sudo apt-get update
          sudo apt-get install k6

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install backend dependencies
        working-directory: backend
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Start backend server
        working-directory: backend
        run: |
          uvicorn src.api:app --host 0.0.0.0 --port 8000 &
          sleep 10
        env:
          DATABASE_URL: sqlite:///./test.db

      - name: Run k6 load tests (when implemented)
        run: |
          # k6 run tests/performance/load-test.js
          echo "k6 performance tests to be implemented"
        continue-on-error: true

  # ============================================================================
  # BUILD - Docker Images
  # ============================================================================

  build-images:
    name: Build Docker Images
    runs-on: ubuntu-latest
    needs: [test-backend, test-frontend, security-sast-python, security-dependencies-python]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build backend image
        uses: docker/build-push-action@v6
        with:
          context: backend
          push: false
          tags: ap2-expense-backend:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build frontend image (when Dockerfile exists)
        run: |
          # docker build -t ap2-expense-frontend:${{ github.sha }} frontend/
          echo "Frontend Dockerfile to be created"
        continue-on-error: true

      - name: Scan images with Trivy
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: ap2-expense-backend:${{ github.sha }}
          format: 'sarif'
          output: 'trivy-results.sarif'
        continue-on-error: true

      - name: Upload Trivy results to GitHub Security
        if: always() && hashFiles('trivy-results.sarif') != ''
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: 'trivy-results.sarif'

      - name: Skip upload (no Trivy report generated)
        if: always() && hashFiles('trivy-results.sarif') == ''
        run: echo "Trivy report not found; skipping SARIF upload."

  # ============================================================================
  # HELM / KUBERNETES VALIDATION
  # ============================================================================

  validate-helm:
    name: Validate Helm Charts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Helm
        uses: azure/setup-helm@v4
        with:
          version: 'latest'

      - name: Lint Helm charts (when they exist)
        run: |
          # helm lint helm/ap2-expense/
          echo "Helm charts to be created"
        continue-on-error: true

      - name: Validate Kubernetes manifests (when they exist)
        run: |
          # helm template helm/ap2-expense/ | kubectl apply --dry-run=server -f -
          echo "Kubernetes manifests to be created"
        continue-on-error: true

  # ============================================================================
  # INFRASTRUCTURE - Terraform Validation
  # ============================================================================

  validate-terraform:
    name: Validate Terraform
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Terraform Format Check (when terraform exists)
        run: |
          # terraform fmt -check -recursive infrastructure/
          echo "Terraform code to be created"
        continue-on-error: true

      - name: Terraform Validate (when terraform exists)
        run: |
          # cd infrastructure/ && terraform init -backend=false && terraform validate
          echo "Terraform code to be created"
        continue-on-error: true

  # ============================================================================
  # STATUS CHECK - Overall Result
  # ============================================================================

  status-check:
    name: CI Status Check
    runs-on: ubuntu-latest
    needs:
      - lint-backend
      - lint-frontend
      - security-sast-python
      - security-dependencies-python
      - security-dependencies-npm
      - test-backend
      - test-frontend
    if: always()
    steps:
      - name: Check job statuses
        run: |
          echo "Lint Backend: ${{ needs.lint-backend.result }}"
          echo "Lint Frontend: ${{ needs.lint-frontend.result }}"
          echo "SAST Python: ${{ needs.security-sast-python.result }}"
          echo "Dependencies Python: ${{ needs.security-dependencies-python.result }}"
          echo "Dependencies npm: ${{ needs.security-dependencies-npm.result }}"
          echo "Test Backend: ${{ needs.test-backend.result }}"
          echo "Test Frontend: ${{ needs.test-frontend.result }}"

      - name: Fail if critical jobs failed
        if: |
          needs.test-backend.result == 'failure' ||
          needs.security-sast-python.result == 'failure'
        run: exit 1
