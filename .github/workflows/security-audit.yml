name: Security Audit

on:
  push:
    branches:
      - main
      - develop
  pull_request:
    branches:
      - main
      - develop
  schedule:
    # Run weekly security audits on Mondays at 9 AM UTC
    - cron: '0 9 * * 1'
  workflow_dispatch: # Allow manual triggers

jobs:
  npm-audit:
    name: NPM Dependency Audit
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      - name: Run NPM audit
        working-directory: frontend
        run: |
          # Run audit and capture output
          npm audit --audit-level=moderate --json > npm-audit-results.json || true

          # Display results
          echo "=== NPM Audit Results ==="
          npm audit --audit-level=moderate || true

          # Check for critical/high vulnerabilities
          CRITICAL_COUNT=$(jq '.metadata.vulnerabilities.critical // 0' npm-audit-results.json)
          HIGH_COUNT=$(jq '.metadata.vulnerabilities.high // 0' npm-audit-results.json)

          echo "Critical vulnerabilities: $CRITICAL_COUNT"
          echo "High vulnerabilities: $HIGH_COUNT"

          # Fail if critical vulnerabilities found
          if [ "$CRITICAL_COUNT" -gt 0 ]; then
            echo "❌ BLOCKING: Critical vulnerabilities found!"
            exit 1
          fi

          # Warn if high vulnerabilities found (but don't block)
          if [ "$HIGH_COUNT" -gt 0 ]; then
            echo "⚠️  WARNING: High severity vulnerabilities found"
            echo "Review DEPENDENCY_AUDIT_REPORT.md for mitigation status"
          fi

      - name: Upload NPM audit results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: npm-audit-results
          path: frontend/npm-audit-results.json
          retention-days: 30

  python-safety-check:
    name: Python Dependency Safety Check
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: backend/requirements.txt

      - name: Install Safety CLI v3
        run: |
          python -m pip install --upgrade pip
          pip install safety==3.2.6

      - name: Run Safety scan (requirements)
        run: |
          safety scan --file backend/requirements.txt --output json > safety-results.json || true
          echo "=== Python Safety Scan (non-blocking) ==="
          safety scan --file backend/requirements.txt --output text || true

          # Parse results (safety 3.x format)
          VULN_COUNT=$(jq '.report_meta.vulnerabilities_found // 0' safety-results.json)

          echo "Vulnerabilities found: $VULN_COUNT"

          # Check for specific critical CVEs
          # Note: ecdsa vulnerabilities are known and documented
          CRITICAL_VULNS=$(jq '[.vulnerabilities[] | select(.CVE != null and .CVE != "CVE-2024-23342")] | length' safety-results.json)

          if [ "$CRITICAL_VULNS" -gt 0 ]; then
            echo "❌ BLOCKING: New critical vulnerabilities found!"
            jq '.vulnerabilities[]' safety-results.json
            exit 1
          fi

          if [ "$VULN_COUNT" -gt 0 ]; then
            echo "⚠️  Known vulnerabilities present (documented in DEPENDENCY_AUDIT_REPORT.md)"
          fi

      - name: Upload Safety scan results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: python-safety-results
          path: safety-results.json
          retention-days: 30

  codeql-analysis:
    name: CodeQL Security Analysis
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      security-events: write

    strategy:
      fail-fast: false
      matrix:
        language: ['javascript', 'python']

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4
        with:
          languages: ${{ matrix.language }}
          queries: security-extended,security-and-quality
          config-file: .github/codeql/codeql-config.yml

      - name: Prep build (frontend)
        if: matrix.language == 'javascript'
        run: |
          pushd frontend
          npm ci
          npm run build || true
          popd

      - name: Prep build (backend)
        if: matrix.language == 'python'
        run: |
          python -m pip install --upgrade pip || true
          pip install -r backend/requirements.txt || true

      - name: Autobuild
        uses: github/codeql-action/autobuild@v4

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v4
        continue-on-error: true
        with:
          category: "/language:${{ matrix.language }}"

  dependency-review:
    name: Dependency Review
    runs-on: ubuntu-latest
    # Dependency review only works for PR events; skip on push/schedule
    if: github.event_name == 'pull_request'
    permissions:
      contents: read
      pull-requests: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Dependency Review
        uses: actions/dependency-review-action@v4
        with:
          fail-on-severity: moderate
          deny-licenses: GPL-2.0, GPL-3.0
          comment-summary-in-pr: always

  security-summary:
    name: Security Summary
    runs-on: ubuntu-latest
    needs: [npm-audit, python-safety-check]
    if: always()

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Download NPM audit results
        uses: actions/download-artifact@v4
        with:
          name: npm-audit-results
          path: ./audit-results

      - name: Download Safety check results
        uses: actions/download-artifact@v4
        with:
          name: python-safety-results
          path: ./audit-results

      - name: Generate Security Summary
        run: |
          echo "# 🔒 Security Audit Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Date:** $(date -u '+%Y-%m-%d %H:%M:%S UTC')" >> $GITHUB_STEP_SUMMARY
          echo "**Commit:** ${{ github.sha }}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY

          echo "## Frontend (NPM)" >> $GITHUB_STEP_SUMMARY
          if [ -f ./audit-results/npm-audit-results.json ]; then
            TOTAL=$(jq '.metadata.vulnerabilities.total // 0' ./audit-results/npm-audit-results.json)
            CRITICAL=$(jq '.metadata.vulnerabilities.critical // 0' ./audit-results/npm-audit-results.json)
            HIGH=$(jq '.metadata.vulnerabilities.high // 0' ./audit-results/npm-audit-results.json)
            MODERATE=$(jq '.metadata.vulnerabilities.moderate // 0' ./audit-results/npm-audit-results.json)

            echo "- Total vulnerabilities: **$TOTAL**" >> $GITHUB_STEP_SUMMARY
            echo "- Critical: **$CRITICAL** 🔴" >> $GITHUB_STEP_SUMMARY
            echo "- High: **$HIGH** 🟠" >> $GITHUB_STEP_SUMMARY
            echo "- Moderate: **$MODERATE** 🟡" >> $GITHUB_STEP_SUMMARY
          fi
          echo "" >> $GITHUB_STEP_SUMMARY

          echo "## Backend (Python)" >> $GITHUB_STEP_SUMMARY
          if [ -f ./audit-results/safety-results.json ]; then
            VULN_COUNT=$(jq '.report_meta.vulnerabilities_found // 0' ./audit-results/safety-results.json)
            echo "- Vulnerabilities found: **$VULN_COUNT**" >> $GITHUB_STEP_SUMMARY
          fi
          echo "" >> $GITHUB_STEP_SUMMARY

          echo "## 📋 Documentation" >> $GITHUB_STEP_SUMMARY
          echo "- See [SECURITY_AUDIT_REPORT_FINAL.md](./SECURITY_AUDIT_REPORT_FINAL.md)" >> $GITHUB_STEP_SUMMARY
          echo "- See [DEPENDENCY_AUDIT_REPORT.md](./DEPENDENCY_AUDIT_REPORT.md)" >> $GITHUB_STEP_SUMMARY
          echo "- See [PRODUCTION_READINESS_SUMMARY.md](./PRODUCTION_READINESS_SUMMARY.md)" >> $GITHUB_STEP_SUMMARY
