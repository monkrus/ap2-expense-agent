name: Continuous Integration

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  # Backend Tests
  backend-tests:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.11', '3.13']

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          cd backend
          pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest pytest-cov black isort mypy pylint

      - name: Run linters
        run: |
          cd backend
          black --check src/ || echo "Black formatting issues found"
          isort --check-only src/ || echo "isort issues found"
          pylint src/ --fail-under=8.0 || echo "Pylint issues found"

      - name: Run tests with coverage
        run: |
          cd backend
          pytest tests/ -v --cov=src --cov-report=xml --cov-report=term

  # Frontend Tests
  frontend-tests:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20.x'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: |
          cd frontend
          npm ci

      - name: Run ESLint
        run: |
          cd frontend
          npm run lint || echo "ESLint issues found"

      - name: Build
        run: |
          cd frontend
          npm run build

  # Integration Tests
  integration-tests:
    runs-on: ubuntu-latest
    needs: [backend-tests]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          cd backend
          pip install -r requirements.txt
          pip install pytest

      - name: Run integration tests
        run: |
          cd backend
          pytest tests/integration/ -v || echo "Integration tests need review"

  # Security Scanning
  security-scan:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Run Bandit security scan
        run: |
          pip install bandit
          cd backend
          bandit -r src/ -ll || echo "Security issues found"

      - name: Run npm audit
        run: |
          cd frontend
          npm ci
          npm audit --audit-level=moderate || echo "Security issues found"
